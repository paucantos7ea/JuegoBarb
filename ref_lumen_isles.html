<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Isles</title>
<style>
html,body{margin:0;height:100%;background:#01030a;overflow:hidden;color:#cfe6ff;font:500 13px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7.5vh;box-sizing:border-box;text-align:center;transition:opacity 1.2s}
#ui.hide{opacity:0}
#tt{transition:opacity 1.6s,transform 1.6s}
#ui.fly #tt{opacity:0;transform:translateY(-14px)}
h1{margin:0 -.42em 0 0;font:200 clamp(28px,4.6vw,66px)/1 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.42em;color:#eef8ff;text-shadow:0 0 26px rgba(70,170,255,.8),0 0 90px rgba(40,110,255,.55)}
#sub{margin-top:16px;letter-spacing:.4em;text-transform:uppercase;font-size:11px;color:#8fc4ff;opacity:.85}
#go{margin-top:22px;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:#fff;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.3}}
#hint{position:fixed;left:0;right:0;bottom:22px;letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:#9cc8f5;opacity:.55;transition:opacity 2s}
#ui.fly.old #hint{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="tt"><h1>LUMEN ISLES</h1><div id="sub">a night flight in one html file</div><div id="go">growing the isles</div></div>
<div id="hint">mouse look &nbsp;·&nbsp; W / S speed &nbsp;·&nbsp; A / D strafe &nbsp;·&nbsp; space up &nbsp;·&nbsp; Q down &nbsp;·&nbsp; shift boost &nbsp;·&nbsp; C cinematic &nbsp;·&nbsp; M sound &nbsp;·&nbsp; H hide text</div></div>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),ui=$('ui');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){$('go').textContent='this needs WebGL2';throw new Error('no webgl2')}
const HDR=!!gl.getExtension('EXT_color_buffer_float');
window.__err=[];

/* ================= math + noise ================= */
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=rng32(90210),rr=(a,b)=>a+(b-a)*rnd(),pick=a=>a[rnd()*a.length|0];
const mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sst=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const h3=(i,j,k)=>{let h=Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(k,1274126177)|0;h=Math.imul(h^h>>>13,1103515245);return((h^h>>>16)>>>0)/4294967296};
function vn(x,y,z){const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z);let u=x-i,v=y-j,w=z-k;u=u*u*(3-2*u);v=v*v*(3-2*v);w=w*w*(3-2*w);
 const a=h3(i,j,k),b=h3(i+1,j,k),c=h3(i,j+1,k),d=h3(i+1,j+1,k),e=h3(i,j,k+1),f=h3(i+1,j,k+1),g=h3(i,j+1,k+1),h=h3(i+1,j+1,k+1);
 const lo=a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v,hi=e+(f-e)*u+(g-e)*v+(e-f-g+h)*u*v;return lo+(hi-lo)*w}
function fbm(x,y,z,o){let s=0,a=.5;for(let i=0;i<o;i++){s+=a*vn(x,y,z);x=x*2.03+5.1;y=y*2.03+1.7;z=z*2.03+9.2;a*=.5}return s}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function mul4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}

/* ================= mesh builders ================= */
/* vertex = pos3, normal3, data4. For flora data = (material, u along, v across, sway) */
const mesh=()=>({v:[],i:[],n:0});
function pv(M,x,y,z,nx,ny,nz,a,b,c,d){M.v.push(x,y,z,nx,ny,nz,a,b,c,d);return M.n++}
function tube(M,pts,rad,sides,mat,sway){
 const n=pts.length,b0=M.n;let ux=0,uy=0,uz=1;
 for(let i=0;i<n;i++){const a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,n-1)];
  let tx=b[0]-a[0],ty=b[1]-a[1],tz=b[2]-a[2];const tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
  const d=ux*tx+uy*ty+uz*tz;let ax=ux-tx*d,ay=uy-ty*d,az=uz-tz*d,l=Math.hypot(ax,ay,az);
  if(l<1e-3){ax=1-tx*tx;ay=-tx*ty;az=-tx*tz;l=Math.hypot(ax,ay,az)}
  ax/=l;ay/=l;az/=l;ux=ax;uy=ay;uz=az;
  const bx=ty*az-tz*ay,by=tz*ax-tx*az,bz=tx*ay-ty*ax,t=i/(n-1),r=rad(t),sw=sway?sway(t):0;
  for(let j=0;j<=sides;j++){const an=j/sides*6.28318,c=Math.cos(an),s=Math.sin(an),nx=ax*c+bx*s,ny=ay*c+by*s,nz=az*c+bz*s;
   pv(M,pts[i][0]+nx*r,pts[i][1]+ny*r,pts[i][2]+nz*r,nx,ny,nz,mat,t,j/sides,sw)}}
 const w=sides+1;for(let i=0;i<n-1;i++)for(let j=0;j<sides;j++){const a=b0+i*w+j;M.i.push(a,a+w,a+1,a+1,a+w,a+w+1)}
}
function ribbon(M,pts,wid,side,mat,sway){
 const n=pts.length,b0=M.n;
 for(let i=0;i<n;i++){const a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,n-1)],t=i/(n-1),s=typeof side=='function'?side(i):side;
  const tx=b[0]-a[0],ty=b[1]-a[1],tz=b[2]-a[2];
  let nx=ty*s[2]-tz*s[1],ny=tz*s[0]-tx*s[2],nz=tx*s[1]-ty*s[0];const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  const w=wid(t)/2,sw=sway?sway(t):0,p=pts[i];
  pv(M,p[0]-s[0]*w,p[1]-s[1]*w,p[2]-s[2]*w,nx,ny,nz,mat,t,0,sw);pv(M,p[0]+s[0]*w,p[1]+s[1]*w,p[2]+s[2]*w,nx,ny,nz,mat,t,1,sw)}
 for(let i=0;i<n-1;i++){const a=b0+i*2;M.i.push(a,a+2,a+1,a+1,a+2,a+3)}
}
/* a leaf blade: a ribbon creased along its midrib; fold>0 lifts the edges, fold<0 lets them droop */
function blade(M,pts,wid,s,mat,sway,fold){
 const n=pts.length,b0=M.n;
 for(let i=0;i<n;i++){const a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,n-1)],t=i/(n-1),p=pts[i],tx=b[0]-a[0],ty=b[1]-a[1],tz=b[2]-a[2];
  let nx=ty*s[2]-tz*s[1],ny=tz*s[0]-tx*s[2],nz=tx*s[1]-ty*s[0],l=Math.hypot(nx,ny,nz)||1;if(ny<0)l=-l;nx/=l;ny/=l;nz/=l;
  const w=wid(t)/2,sw=sway?sway(t):0,f=fold(t);
  for(const e of[-1,1]){const mx=nx-e*s[0]*f,my=ny-e*s[1]*f,mz=nz-e*s[2]*f,ml=Math.hypot(mx,my,mz);
   pv(M,p[0],p[1],p[2],mx/ml,my/ml,mz/ml,mat,t,.5,sw);pv(M,p[0]+(e*s[0]+nx*f)*w,p[1]+(e*s[1]+ny*f)*w,p[2]+(e*s[2]+nz*f)*w,mx/ml,my/ml,mz/ml,mat,t,e<0?0:1,sw)}}
 for(let i=0;i<n-1;i++)for(let h=0;h<2;h++){const a=b0+i*4+h*2;M.i.push(a,a+4,a+1,a+1,a+4,a+5)}
}
function dome(M,c,rx,ry,mat,l0,l1,seg,rings,sw){
 const b0=M.n;
 for(let i=0;i<=rings;i++){const la=mix(l0,l1,i/rings),cl=Math.cos(la),sl=Math.sin(la);
  for(let j=0;j<=seg;j++){const lo=j/seg*6.28318,nx=cl*Math.cos(lo),nz=cl*Math.sin(lo);pv(M,c[0]+nx*rx,c[1]+sl*ry,c[2]+nz*rx,nx,sl,nz,mat,i/rings,j/seg,sw)}}
 const w=seg+1;for(let i=0;i<rings;i++)for(let j=0;j<seg;j++){const a=b0+i*w+j;M.i.push(a,a+w,a+1,a+1,a+w,a+w+1)}
}

/* ================= shaders ================= */
const FSV=`out vec2 vU;void main(){vec2 p=vec2(float(gl_VertexID&1)*4.-1.,float(gl_VertexID>>1)*4.-1.);vU=p;gl_Position=vec4(p,0.,1.);}`;
const HUE=`vec3 hue(float h){return clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.);}`;
const COMMON=`
uniform sampler2D uN;uniform float uT,uClip;uniform vec3 uCam;
const vec3 MOON=normalize(vec3(.55,.42,-.77)),PLAN=normalize(vec3(-.42,.19,-.9)),MC=vec3(.5,.68,1.);
float n3(vec3 x){vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);vec2 uv=p.xy+vec2(37.,17.)*p.z+f.xy;vec2 rg=textureLod(uN,(uv+.5)/256.,0.).yx;return mix(rg.x,rg.y,f.z);}
float fbm3(vec3 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n3(p);p=p*2.02+vec3(7.1,3.3,5.7);a*=.5;}return s;}
float n3q(vec3 x){vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);ivec2 i=ivec2(p.xy+vec2(37.,17.)*p.z);
 vec2 a=texelFetch(uN,i&255,0).yx,b=texelFetch(uN,(i+ivec2(1,0))&255,0).yx,c=texelFetch(uN,(i+ivec2(0,1))&255,0).yx,d=texelFetch(uN,(i+ivec2(1,1))&255,0).yx;
 vec2 rg=mix(mix(a,b,f.x),mix(c,d,f.x),f.y);return mix(rg.x,rg.y,f.z);}
float fbm3q(vec3 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n3q(p);p=p*2.02+vec3(7.1,3.3,5.7);a*=.5;}return s;}
${HUE}
vec3 skyB(vec3 d){
 vec3 c=mix(vec3(.007,.019,.06),vec3(.0012,.003,.014),pow(clamp(d.y,0.,1.),.4));
 c=mix(c,vec3(.0028,.008,.026),smoothstep(0.,-.55,d.y));
 float m=max(dot(d,MOON),0.);c+=vec3(.2,.3,.58)*(pow(m,60.)*.16+pow(m,7.)*.022);
 float p=max(dot(d,PLAN),0.);c+=vec3(.02,.11,.2)*pow(p,9.)*.22;
 return c;}
vec3 amb(vec3 n){return mix(vec3(.01,.02,.045),vec3(.026,.045,.1),n.y*.5+.5)+vec3(.015,.075,.11)*max(dot(n,PLAN),0.);}
vec3 fog(vec3 c,vec3 e,float d,vec3 rd){float f=1.-exp(-d*.0005);return mix(c,skyB(rd),f)+e*(1.-f*.6);}
`;
const LIT=`
uniform highp sampler2DShadow uS0,uS1;uniform sampler2D uLM;uniform mat4 uL0,uL1;
float pcf(highp sampler2DShadow s,vec3 c,float r){return(texture(s,c)*2.+texture(s,c+vec3(r,r*.4,0.))+texture(s,c+vec3(-r*.4,r,0.))+texture(s,c+vec3(-r,-r*.4,0.))+texture(s,c+vec3(r*.4,-r,0.)))/6.;}
/* moon shadow: a sharp cascade around the camera inside a static one for the whole archipelago */
float shd(vec3 p,vec3 n){
 vec3 a=(uL0*vec4(p+n*.14,1.)).xyz,b=(uL1*vec4(p+n*.7,1.)).xyz;
 float k=smoothstep(.98,.84,max(abs(a.x),abs(a.y)))*step(abs(a.z),1.),s=1.;
 if(k<1.&&max(abs(b.x),abs(b.y))<1.&&abs(b.z)<1.)s=pcf(uS1,b*.5+.5-vec3(0.,0.,.00035),1.1/4096.);
 return k>0.?mix(s,pcf(uS0,a*.5+.5-vec3(0.,0.,.00012),1.3/2048.),k):s;}
/* light cast by the glowing plants and water, baked top-down */
vec3 glw(vec3 p){return texture(uLM,p.xz/2000.+.5).rgb;}
`;
const FRD=`/* pinnate frond: a midrib and pointed leaflets cut out of a ribbon */
float fal(float u,float v){float x=abs(v-.5)*2.,e=fwidth(x)*1.2+.001,lu=u*26.+x*2.4,lw=fwidth(lu)+.002,pr=sin(pow(u,.7)*3.1416),hw=.4*pow(clamp(1.-x/max(pr,.001),0.,1.),.5),cu=abs(fract(lu)-.5);
 return max(clamp((.045-x)/e+.5,0.,1.),clamp((hw-cu)/lw+.5,0.,1.)*step(x,pr));}
/* broad leaf: round base, pointed tip */
float lal(float u,float v){float x=abs(v-.5)*2.;return clamp((pow(sin(pow(u,.55)*3.1416),.7)*.96-x)/(fwidth(x)*1.2+.002)+.5,0.,1.);}
`;
const SIS_V=`layout(location=0)in vec3 aP;uniform mat4 uVP;void main(){gl_Position=uVP*vec4(aP,1.);}`,SH_F=`void main(){}`;
const SFL_F=FRD+`in vec4 vD;void main(){int m=int(vD.x+.5);float u=clamp(vD.y,0.,1.),v=clamp(vD.z,0.,1.);if((m==1&&fal(u,v)<.5)||(m==13&&lal(u,v)<.5))discard;}`;
const SKY_F=COMMON+`
in vec2 vU;out vec4 o;uniform vec3 uR,uU,uF;uniform float uPA;
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
void main(){
 vec3 d=normalize(uF+uR*vU.x+uU*vU.y);
 vec3 c=skyB(d);
 /* milky way: a warped band with a warm core and dark dust lanes */
 vec3 G=normalize(vec3(.18,-.81,-.56));
 float f1=fbm3(d*3.2+1.7),f2=fbm3(d*8.+f1*2.5),f3=fbm3(d*21.+f2*2.);
 float gw=dot(d,G)+(f1-.5)*.14,mw=exp(-gw*gw*14.),core=mw*smoothstep(.2,.7,f1*.55+f2*.6);
 float lane=smoothstep(.42,.62,fbm3(d*5.5+vec3(9.,2.,5.)+f2*1.5))*exp(-gw*gw*45.);
 c+=mix(vec3(.035,.06,.17),vec3(.15,.12,.15),smoothstep(.45,.85,f2))*core*(.3+1.1*f3)*.6*(1.-lane*.8);
 /* stars: three shells of cells; radius is tied to pixel size so every star stays pin sharp */
 float up=smoothstep(-.02,.1,d.y),k=clamp(.00107/uPA,.6,1.7);
 for(int i=0;i<3;i++){float sc=(i==0?165.:i==1?110.:62.)*k;vec3 p=d*sc,ip=floor(p),h=h33(ip+float(i)*17.3);vec3 q=fract(p)-.5-(h-.5)*.5;
  float r0=uPA*sc,r2=dot(q,q)/(r0*r0);
  float b=i==0?pow(h.x,8.)*.35*(.5+2.5*core):i==1?pow(h.x,14.)*1.6*(.6+1.2*core):pow(h.x,22.)*5.;
  float tw=.8+.2*sin(uT*(1.5+h.y*4.)+h.z*60.);
  c+=mix(vec3(.55,.72,1.),vec3(1.,.82,.62),h.z*h.z)*(exp(-r2*2.6)+(i==2?exp(-r2*.35)*.04:0.))*b*tw*4.*up*(1.-lane*.6);}
 /* moonlit cirrus */
 vec2 cp=d.xz/(max(d.y,0.)+.16)*1.1+vec2(uT*.002,0.);float w1=fbm3(vec3(cp*.7,2.));
 float ci=fbm3(vec3(cp+w1*.9,4.))*.65+fbm3(vec3(cp*3.1-w1,7.))*.35;
 float ca=smoothstep(.47,.7,ci)*smoothstep(.01,.1,d.y)*smoothstep(.62,.16,d.y);
 c=mix(c,vec3(.01,.02,.05)+vec3(.15,.2,.35)*pow(max(dot(d,MOON),0.),6.)+vec3(.025,.04,.085)*smoothstep(.5,.9,ci),ca*.7);
 /* moon: small textured disc with a tight halo */
 vec3 mx=normalize(cross(MOON,vec3(0.,1.,0.))),my=cross(mx,MOON);vec2 mp=vec2(dot(d,mx),dot(d,my))/.0175;float mr=length(mp),md=acos(clamp(dot(d,MOON),-1.,1.));
 if(dot(d,MOON)>0.&&mr<1.2){float mt=.4+.6*smoothstep(.3,.7,fbm3(vec3(mp*1.6,3.)));c=mix(c,vec3(.8,.88,1.)*5.5*mt*pow(max(1.-mr*mr,0.),.25),smoothstep(1.,.93,mr));}
 c+=vec3(.7,.82,1.)*(exp(-md*34.)*.28+exp(-md*9.)*.02);
 /* gas giant with fine banding, a thin ring and a lit limb */
 vec3 C=PLAN*10.,ax=normalize(vec3(.32,1.,.22)),SL=normalize(vec3(.8,.42,-.12));float PR=2.25,b=dot(d,C),q2=b*b-dot(C,C)+PR*PR,pm=0.,tp=1e9;
 if(q2>0.&&b>0.){tp=b-sqrt(q2);vec3 n=normalize(d*tp-C);
  float la=dot(n,ax),w=fbm3(n*2.4+vec3(0.,uT*.003,0.)),w2=fbm3(n*7.+w*2.);
  float bd=n3(vec3(la*6.5+w*1.5,w*2.,1.5)),b2=n3(vec3(la*19.+w2*3.,3.,7.)),b3=n3(vec3(la*55.+w2*5.,w*3.,2.));
  vec3 pc=mix(vec3(.012,.05,.2),vec3(.08,.3,.6),bd);pc=mix(pc,vec3(.42,.68,.9),b2*b2*.45);pc*=.75+.5*b3;
  float li=smoothstep(-.08,.5,dot(n,SL)),fr=pow(1.-max(dot(n,-d),0.),3.);
  pc=pc*(li*.36+.005)+vec3(.08,.35,.8)*fr*(li*.55+.012);
  pm=smoothstep(0.,.02,q2/(PR*PR));c=mix(c,pc,pm);}
 float dn=dot(d,ax);if(abs(dn)>1e-4){float tr=dot(C,ax)/dn;vec3 hp=d*tr-C;float rr=length(hp)/PR;
  if(tr>0.&&tr<tp&&rr>1.3&&rr<1.8){
   float rb=(.3+.7*n3(vec3(rr*38.,1.,2.)))*(.45+.55*n3(vec3(rr*9.,5.,1.)))*smoothstep(1.3,1.38,rr)*smoothstep(1.8,1.7,rr)*(1.-.85*smoothstep(.03,0.,abs(rr-1.58)));
   float sh=dot(hp,SL)<0.&&length(hp-SL*dot(hp,SL))<PR?.05:1.;
   c=mix(c,vec3(.25,.45,.8)*.2*sh,rb*.5);}}
 float pa=acos(clamp(dot(d,PLAN),-1.,1.))-asin(PR/10.);
 c+=vec3(.03,.16,.34)*exp(-max(pa,0.)*16.)*.1*(1.-pm);
 o=vec4(c,1.);}`;
const CLOUD_F=COMMON+`
in vec2 vU;out vec4 o;uniform vec3 uR,uU,uF;
float cd(vec3 p){vec3 q=p*.0042+vec3(uT*.006,0.,uT*.003);
 float d=(n3(q)*.5+n3(q*2.3+vec3(3.1,1.7,5.3))*.25+n3(q*5.29+vec3(1.3,8.1,2.2))*.125)*1.1-.2-(p.y+400.)*.0043;
 if(d>-.08)d-=(n3(q*12.+vec3(0.,uT*.02,0.))*.5+n3(q*27.)*.25)*.11;
 return clamp(d*6.,0.,1.);}
float cl(vec3 p){vec3 q=p*.0042+vec3(uT*.006,0.,uT*.003);return clamp(((n3(q)*.5+n3(q*2.3+vec3(3.1,1.7,5.3))*.25)*1.25-.2-(p.y+400.)*.0043)*5.,0.,1.);}
void main(){
 vec3 rd=normalize(uF+uR*vU.x+uU*vU.y);
 if(rd.y>-.003){o=vec4(0.);return;}
 float t0=max((-300.-uCam.y)/rd.y,0.),t1=(-400.-uCam.y)/rd.y;
 vec3 hz=skyB(rd),deep=vec3(.002,.005,.017);
 if(t0>8000.){o=vec4(hz,1.);return;}
 float tm=min(t1,t0+2600.),dt=(tm-t0)/32.,t=t0+dt*fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453),T=1.;vec3 c=vec3(0.);
 for(int i=0;i<32;i++){vec3 p=uCam+rd*t;float d=cd(p);
  if(d>.01){float sh=exp(-cl(p+MOON*22.)*1.7-cl(p+MOON*64.)*.9),h=(p.y+400.)*.01;
   vec3 lc=mix(vec3(.003,.007,.024),vec3(.09,.15,.33),sh*(.1+.9*h))+vec3(.004,.009,.025)*h;
   lc+=vec3(.11,.16,.3)*sh*pow(1.-d,3.)*.4*h;
   lc+=vec3(0.,.03,.14)*smoothstep(.55,.8,n3(vec3(p.xz*.0017,uT*.035)))*(1.-h);
   lc=mix(lc,hz,1.-exp(-t*.00055));
